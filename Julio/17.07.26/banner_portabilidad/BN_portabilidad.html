<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Seleccionamos todos los botones que tengan esa clase
    const botones = document.querySelectorAll(
      ".btn-primary.stefa_primary_btn_kenos.btn-dropped",
    );

    botones.forEach((boton) => {
      boton.addEventListener("click", (e) => {
        e.preventDefault();

        // Ocultamos SOLO el botón clicado
        boton.style.display = "none";

        // Buscamos el formulario correspondiente dentro del mismo swiper-slide
        const slide = boton.closest(".swiper-slide");
        const formulario = slide.querySelector(".stefa_formulario_contenedor");

        if (formulario) {
          formulario.classList.remove("d-none"); // quitar clase que lo oculta (si aplica)
          formulario.style.display = "flex"; // aseguramos que sea visible
        }

        if (window.Swiper) {
          document
            .querySelectorAll(".swiper-container")
            .forEach((container) => {
              if (container.swiper) {
                container.swiper.updateAutoHeight(300);
              }
            });
        }
      });
    });
  });
</script>
<script>
  window.addEventListener("load", function () {
    const paginationContainer = document.querySelector(
      ".stefa_banner_kenos_general .swiper-pagination",
    );
    let currentProgress = 0;
    let progressInterval;

    function addNumbersToBullets() {
      const bullets = paginationContainer.querySelectorAll(
        ".stefa_banner_kenos_general .swiper-pagination-bullet",
      );
      bullets.forEach((bullet, index) => {
        if (bullet.textContent.trim() === "") {
          bullet.textContent = (index + 1).toString();
        }
      });
    }

    function startProgressBar(bullet) {
      clearInterval(progressInterval);
      currentProgress = 0;
      bullet.style.setProperty("--progress", "0%");
      progressInterval = setInterval(() => {
        currentProgress += 1;
        if (currentProgress > 100) {
          clearInterval(progressInterval);
          return;
        }
        bullet.style.setProperty("--progress", currentProgress + "%");
      }, 20);
    }

    const observer = new MutationObserver(() => {
      // Desconectamos observer para evitar loop
      observer.disconnect();

      addNumbersToBullets();

      const activeBullet = paginationContainer.querySelector(
        ".stefa_banner_kenos_general .swiper-pagination-bullet-active",
      );
      if (activeBullet) {
        // Solo quitamos estilos si tienen el '--progress'
        paginationContainer
          .querySelectorAll(
            ".stefa_banner_kenos_general .swiper-pagination-bullet",
          )
          .forEach((b) => b.style.removeProperty("--progress"));

        // Solo agregar clase si no existe
        if (
          !paginationContainer.classList.contains("swiper-animation-pagination")
        ) {
          paginationContainer.classList.add("swiper-animation-pagination");
        }

        startProgressBar(activeBullet);
      }

      // Volvemos a conectar el observer
      observer.observe(paginationContainer, {
        subtree: true,
        attributes: true,
        childList: true,
        attributeFilter: ["class"],
      });
    });

    // Inicializamos el observer
    observer.observe(paginationContainer, {
      subtree: true,
      attributes: true,
      childList: true,
      attributeFilter: ["class"],
    });

    // Resto de funciones sin cambios
    function updateActiveBullet() {
      document
        .querySelectorAll(".general_animation .swiper-pagination-bullet")
        .forEach((bullet) => {
          bullet.classList.remove("swiper-pagination-bullet-active");
        });
      const activeBullet = document.querySelector(
        ".general_animation .swiper-pagination-bullet-active",
      );
      if (activeBullet) {
        activeBullet.classList.add("swiper-pagination-bullet-active");
      }
    }

    function applyClassBasedOnSlideCount() {
      const slides = document.querySelectorAll(
        ".general_animation .swiper-slide:not(.swiper-slide-duplicate)",
      );
      const pagination = document.querySelector(
        ".general_animation .swiper-animation-pagination",
      );
      const flechaIzquierda = document.querySelector(
        ".general_animation .swiper-button-prev.lt-button-prev",
      );
      const flechaDerecha = document.querySelector(
        ".general_animation .swiper-button-next.lt-button-next",
      );

      if (!pagination) return;

      const visibleSlides = Array.from(slides).filter(
        (slide) => slide.innerHTML.trim() !== "",
      );
      const count = visibleSlides.length;
      const className = `stefa_${count}_item_count`;

      const elementsToUpdate = [pagination, flechaIzquierda, flechaDerecha];

      elementsToUpdate.forEach((element) => {
        if (!element) return;

        element.classList.forEach((cls) => {
          if (cls.startsWith("stefa_") && cls.endsWith("_item_count")) {
            element.classList.remove(cls);
          }
        });

        element.classList.add(className);
      });
    }

    setTimeout(() => {
      const bullets = document.querySelectorAll(
        ".stefa_banner_kenos_general .swiper-pagination-bullet",
      );
      bullets.forEach((bullet, index) => {
        bullet.textContent = (index + 1).toString();
      });
    }, 500);

    // Reemplazo seguro de IDs
    const formattedTitle = document.title
      .split(/[\|\-]/)[0]
      .trim()
      .toLowerCase()
      .replace(/\s+/g, "_");

    const slides = document.querySelectorAll(".swiper-slide");
    slides.forEach((slide, index) => {
      slide.querySelectorAll("[id]").forEach((element) => {
        if (
          element.id.includes("${index}") ||
          element.id.includes("${name-lp}")
        ) {
          let newId = element.id
            .replace("${index}", index)
            .replace("${name-lp}", formattedTitle);
          element.id = newId;
        }
      });
    });

    const customSwiper = new Swiper(".general_animation .swiper-container", {
      loop: true,
      pagination: {
        el: ".general_animation .swiper-pagination",
        clickable: true,
      },
      autoplay: {
        delay: 3000,
        disableOnInteraction: false,
      },
      on: {
        slideChange: function () {
          setTimeout(updateActiveBullet, 10);
        },
      },
    });

    document
      .querySelector(".general_animation .swiper-pagination")
      .addEventListener("click", () => {
        setTimeout(updateActiveBullet, 10);
      });

    applyClassBasedOnSlideCount();
  });
</script>
