<section
  class="banner-hero-front"
  lt-carousel="view: 1; autoplay: false; delay: 7000; autoheight: false"
>
  <div class="swiper-container">
    <div class="swiper-wrapper">
      <!-- SWIPER SLIDE 1 -->
      <div class="swiper-slide dev-banner-container">
        <picture class="dev-banner__fondo-pic">
          <source srcset="" media="(min-width:1280px)" />
          <source srcset="" media="(min-width:768px)" />
          <img
            src="#"
            alt="Banner hero"
            class="dev-banner__fondo-img"
            width="1950"
            height="500"
          />
        </picture>
        <div class="dev-banner__inner">
          <!--CONTENIDO BANNER-->
          <p>tESTEANDO EL SWIPEPR</p>
        </div>
      </div>
    </div>
    <div
      class="swiper-button-next lt-button-next lt-swiper-nav slider-seo__nav"
    >
      <svg
        aria-hidden="true"
        class="svg--icon--background--next"
        focusable="false"
        role="img"
        viewbox="0 0 8 11"
      ></svg>
    </div>
    <div
      class="swiper-button-prev lt-button-prev lt-swiper-nav slider-seo__nav"
    >
      <svg
        aria-hidden="true"
        class="svg--icon--background--prev"
        focusable="false"
        role="img"
        viewbox="0 0 8 11"
      ></svg>
    </div>
    <div class="swiper-pagination d-none"></div>
  </div>
</section>
