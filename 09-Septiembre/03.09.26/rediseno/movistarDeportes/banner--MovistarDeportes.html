<script>
  document.addEventListener("DOMContentLoaded", () => {
    const swiperContainer = document.querySelector(
      "#swiperBanners .swiper-container",
    );

    function attachListener() {
      if (swiperContainer && swiperContainer.swiper) {
        const swiperInstance = swiperContainer.swiper;
        const nextBtn = document.querySelector(
          "#swiperBanners .swiper-button-next",
        );
        const prevBtn = document.querySelector(
          "#swiperBanners .swiper-button-prev",
        );

        swiperInstance.on("slideChange", () => {
          nextBtn.classList.remove("active-color");
          prevBtn.classList.remove("active-color");

          // Ejemplo: cambia color si el segundo slide (índice 1) está activo
          if (swiperInstance.activeIndex === 1) {
            nextBtn.classList.add("active-color");
            prevBtn.classList.add("active-color");
          }
        });

        console.log("Listener conectado al Swiper #swiperBanners");
      } else {
        setTimeout(attachListener, 100); // reintenta hasta que la instancia exista
      }
    }

    attachListener();
  });
  document.addEventListener("DOMContentLoaded", () => {
    const swiperContainer = document.querySelector(
      "#swiperBanners .swiper-container",
    );

    function attachNav() {
      if (swiperContainer && swiperContainer.swiper) {
        const swiperInstance = swiperContainer.swiper;
        const nextBtn = document.querySelector(
          "#swiperBanners .swiper-button-next",
        );
        const prevBtn = document.querySelector(
          "#swiperBanners .swiper-button-prev",
        );

        // Conectar flechas externas al Swiper
        nextBtn.addEventListener("click", () => swiperInstance.slideNext());
        prevBtn.addEventListener("click", () => swiperInstance.slidePrev());

        console.log("Flechas externas conectadas al Swiper #swiperBanners");
      } else {
        setTimeout(attachNav, 100); // reintenta hasta que la instancia exista
      }
    }

    attachNav();
  });
</script>
