<script>
  // Inicialización: mostrar solo el primer slider al cargar la página
  window.onload = function () {
    const slider1 = document.querySelector(".stefa_renSlider-1");
    const slider2 = document.querySelector(".stefa_renSlider-2");

    // Mostrar solo el primer slider al inicio
    slider1.style.display = "block";
    slider2.style.display = "none";

    // Función para cambiar entre sliders
    function toggleSliders() {
      if (slider1.style.display !== "none") {
        slider1.style.display = "none";
        slider2.style.display = "block"; // Mostrar el segundo slider
      } else {
        slider1.style.display = "block"; // Volver a mostrar el primer slider
        slider2.style.display = "none";
      }
    }

    // Cambiar al segundo slider después de 4 segundos
    setTimeout(toggleSliders, 2000); // Cambia a stefa_renSlider-2 después de 4 segundos

    // Cambiar de vuelta al primer slider después de 8 segundos (total de 4+4 segundos)
    setTimeout(toggleSliders, 4000); // Cambia a stefa_renSlider-1 después de otros 4 segundos

    // Repetir indefinidamente
    setInterval(toggleSliders, 4000); // Alternar cada 8 segundos
  };
</script>
