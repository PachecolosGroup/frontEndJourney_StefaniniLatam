  <style>
    .stefa-dsn-sct1,
    .stefa-dsn-sct2,
    .stefa-dsn-sct3 {
      --stefa-dsn-navy: #0f2b3d;
      --stefa-dsn-navy-hover: #16405b;
      --stefa-dsn-ink: #1a1d29;
      --stefa-dsn-border: #9fd4e8;
      --stefa-dsn-white: #ffffff;
      --stefa-dsn-focus: #1f7fa8;

      --stefa-dsn-max: 1120px;
      --stefa-dsn-gutter: 20px;
      --stefa-dsn-radius: 8px;
      --stefa-dsn-radius-lg: 12px;

      --stefa-dsn-font:
        "Inspire TMM", "Avenir Next", "Segoe UI", system-ui, -apple-system,
        "Helvetica Neue", Arial, sans-serif;

      box-sizing: border-box;
      font-family: var(--stefa-dsn-font);
      color: var(--stefa-dsn-ink);
      background-color: var(--stefa-dsn-white);
    }

    .stefa-dsn-sct1 img,
    .stefa-dsn-sct2 img,
    .stefa-dsn-sct3 img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .stefa-dsn-sct1 picture,
    .stefa-dsn-sct2 picture,
    .stefa-dsn-sct3 picture {
      display: block;
    }

    .stefa-dsn-sct1 button,
    .stefa-dsn-sct2 button,
    .stefa-dsn-sct3 button {
      text-decoration: none !important;
      transition: ease all 0.2s;
    }
    .stefa-dsn-sct1 a:focus-visible,
    .stefa-dsn-sct2 a:focus-visible,
    .stefa-dsn-sct3 a:focus-visible {
      outline: 3px solid var(--stefa-dsn-focus);
      outline-offset: 3px;
    }

    /* fonts */
    .stefa-l1max-sct1_txt1 {
      font-weight: 400;
      font-size: 32px;
      line-height: 40px;
      letter-spacing: 0%;
      text-align: center;
    }

    .stefa-dsn-sct1 {
      padding: 32px var(--stefa-dsn-gutter);
    }

    .stefa-dsn-sct1__inner {
      max-width: var(--stefa-dsn-max);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .stefa-dsn-sct1__text {
      margin: 0;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 400;
      color: var(--stefa-dsn-ink);
    }

    .stefa-dsn-sct1__text strong {
      font-weight: 700;
    }

    .stefa-dsn-sct1__media {
      width: 100%;
    }

    .stefa-dsn-sct1__media img {
      width: 100%;
      border-radius: var(--stefa-dsn-radius);
    }

    @media screen and (max-width: 767px) {
      .stefa-l1max-sct1_txt1 {
        font-weight: 400;
        font-size: 32px;
        line-height: 40px;
        letter-spacing: 0%;
        text-align: center;
      }
    }

    /* --- Tablet --- */
    @media (min-width: 768px) {
      .stefa-dsn-sct1 {
        padding: 40px var(--stefa-dsn-gutter);
      }

      .stefa-dsn-sct1__inner {
        flex-direction: row;
        align-items: center;
        gap: 32px;
      }
      .stefa-dsn-sct1__copy {
        flex: 1 1 50%;
      }
      .stefa-dsn-sct1__media {
        flex: 1 1 50%;
      }
      .stefa-dsn-sct1__text {
        font-size: 21px;
      }
    }

    /* --- Desktop --- */
    @media (min-width: 1024px) {
      .stefa-dsn-sct1 {
        padding: 56px var(--stefa-dsn-gutter);
      }

      .stefa-dsn-sct1__inner {
        gap: 56px;
      }
      .stefa-dsn-sct1__copy {
        flex: 1 1 46%;
      }
      .stefa-dsn-sct1__media {
        flex: 0 1 44%;
      }

      .stefa-dsn-sct1__text {
        font-size: 24px;
        line-height: 1.5;
        max-width: 22em;
      }
    }

    /* ==========================================================================
   SECCIÓN 2 — Tarjeta con borde y banner del plan
   ========================================================================== */
    .stefa-dsn-sct2 {
      padding: 0 var(--stefa-dsn-gutter) 32px;
    }

    .stefa-dsn-sct2__card {
      max-width: var(--stefa-dsn-max);
      margin: 0 auto;
      padding: 20px;
      border: 1px solid var(--stefa-dsn-border);
      border-radius: var(--stefa-dsn-radius);
      background-color: var(--stefa-dsn-white);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .stefa-dsn-sct2__text {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
      color: var(--stefa-dsn-ink);
    }

    .stefa-dsn-sct2__text strong {
      font-weight: 700;
    }

    /* El fondo oscuro va en el enlace: así el bloque se ve correcto
   aunque el asset del logo llegue con fondo transparente. */
    .stefa-dsn-sct2__banner {
      display: block;
      width: 100%;
      border-radius: var(--stefa-dsn-radius);
      background-color: var(--stefa-dsn-navy);
      overflow: hidden;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .stefa-dsn-sct2__banner:hover {
      background-color: var(--stefa-dsn-navy-hover);
    }

    .stefa-dsn-sct2__banner img {
      width: 100%;
    }

    /* --- Tablet --- */
    @media (min-width: 768px) {
      .stefa-dsn-sct2 {
        padding-bottom: 40px;
      }

      .stefa-dsn-sct2__card {
        flex-direction: row;
        align-items: center;
        gap: 24px;
        padding: 22px 24px;
      }
      .stefa-dsn-sct2__text {
        flex: 1 1 auto;
      }
      .stefa-dsn-sct2__banner {
        flex: 0 0 610px;
        width: 320px;
      }
    }

    /* --- Desktop --- */
    @media (min-width: 1024px) {
      .stefa-dsn-sct2 {
        padding-bottom: 56px;
      }

      .stefa-dsn-sct2__card {
        padding: 24px 28px;
        gap: 32px;
      }
      .stefa-dsn-sct2__text {
        font-size: 17px;
        max-width: 26em;
      }

      .stefa-dsn-sct2__banner {
        flex: 0 0 610px;
        width: 420px;
      }
    }

    /* ==========================================================================
   SECCIÓN 3 — Título, grilla de 3 y llamada a la acción
   ========================================================================== */
    .stefa-dsn-sct3 {
      padding: 32px var(--stefa-dsn-gutter) 48px;
      text-align: center;
    }

    .stefa-dsn-sct3__inner {
      max-width: var(--stefa-dsn-max);
      margin: 0 auto;
    }

    .stefa-dsn-sct3__title {
      margin: 0 auto 24px;
      font-size: 21px;
      line-height: 1.4;
      font-weight: 400;
      max-width: 16em;
      color: var(--stefa-dsn-ink);
    }

    .stefa-dsn-sct3__title strong {
      font-weight: 700;
    }

    .stefa-dsn-sct3__grid {
      list-style: none;
      margin: 0 0 20px;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .stefa-dsn-sct3__item {
      margin: 0;
    }

    .stefa-dsn-sct3__item img {
      width: 100%;
      border-radius: var(--stefa-dsn-radius);
    }

    .stefa-dsn-sct3__more {
      font-weight: 500;
      font-style: Medium;
      font-size: 24px;
      line-height: 100%;
      letter-spacing: 0%;
      text-align: center;
      vertical-align: middle;
      color: var(--stefa-dsn-ink);
    }

    .stefa-dsn-sct3__cta {
      display: inline-block;
      min-width: 210px;
      padding: 14px 28px;
      border-radius: 999px;
      background-color: var(--stefa-dsn-navy);
      color: var(--stefa-dsn-white);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      text-decoration: none !important;
      transition: background-color 0.2s ease;
    }

    .stefa-dsn-sct3__cta:hover {
      background-color: var(--stefa-dsn-navy-hover);
      color: white;
    }

    /* --- Tablet --- */
    @media (min-width: 768px) {
      .stefa-dsn-sct3 {
        padding: 40px var(--stefa-dsn-gutter) 56px;
      }

      .stefa-dsn-sct3__title {
        font-size: 23px;
        max-width: 20em;
        margin-bottom: 28px;
      }

      .stefa-dsn-sct3__grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
    }

    /* --- Desktop --- */
    @media (min-width: 1024px) {
      .stefa-dsn-sct3 {
        padding: 48px var(--stefa-dsn-gutter) 72px;
      }

      .stefa-dsn-sct3__title {
        font-size: 26px;
        max-width: 24em;
        margin-bottom: 32px;
      }

      .stefa-dsn-sct3__grid {
        gap: 12px;
        margin-bottom: 24px;
      }

      .stefa-dsn-sct3__cta {
        padding: 15px 34px;
        font-size: 16px;
      }
    }

    /* --- Respeta a quien desactiva las animaciones --- */
    @media (prefers-reduced-motion: reduce) {
      .stefa-dsn-sct2__banner,
      .stefa-dsn-sct3__cta {
        transition: none;
      }
    }
  </style>
</div>
